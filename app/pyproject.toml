[project]
name = "rag-lab"
version = "0.1.0"
description = "Retrieval quality as a number: chunking, embeddings, hybrid retrieval, grounded answers, and an eval gate."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "rank-bm25>=0.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "fastembed>=0.3",
  "onnxruntime==1.20.1",
  "qdrant-client>=1.9",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
