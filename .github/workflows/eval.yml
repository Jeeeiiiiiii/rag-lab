name: retrieval quality

# Two gates on every change: the unit tests, and the golden-set eval. A
# chunking or retrieval change that drops heading·hybrid hit@5 below 0.9
# fails the build — retrieval quality is a regression test, not a demo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (hashing embedder, in-memory store)
        run: python -m pytest -q
      - name: Golden-set eval, gated
        run: python -m rag_lab eval -k 5 --gate 0.9 | tee eval.md
      - name: Publish the table to the job summary
        run: cat eval.md >> "$GITHUB_STEP_SUMMARY"
